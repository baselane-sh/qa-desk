<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qa-desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 20 20">
    <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
    <line x1="14" y1="14" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 20 20">
    <path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
  </symbol>
  <symbol id="i-external" viewBox="0 0 20 20">
    <path d="M8 5h7v7M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
  </symbol>
</svg>
<header class="topbar">
  <strong class="brand">qa-desk</strong>
  <nav class="tabs" id="tabs">
    <button data-view="cases" class="active">Cases</button>
    <button data-view="runs">Runs</button>
  </nav>
  <span id="run-badge" class="badge muted">No run selected</span>
  <span id="toast" class="toast" hidden></span>
</header>
<div id="banner-wrap" aria-live="assertive"></div>
<main id="root" class="layout"></main>
<footer class="legend">
  <span><kbd>j</kbd> <kbd>k</kbd> move</span>
  <span><kbd>p</kbd> <kbd>f</kbd> <kbd>b</kbd> <kbd>s</kbd> <kbd>r</kbd> verdict</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>Enter</kbd> actual result</span>
  <span><kbd>/</kbd> search</span>
  <span><kbd>Esc</kbd> leave field</span>
  <span><kbd>?</kbd> keys</span>
  <span class="conn"><span id="conn-dot" class="dot online"></span><span id="conn-label">Connected</span></span>
  <span id="offline-help" class="muted" hidden></span>
</footer>
<div id="overlay-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
