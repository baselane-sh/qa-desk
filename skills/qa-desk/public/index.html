<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qa-desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <strong class="brand">qa-desk</strong>
  <nav class="tabs" id="tabs">
    <button data-view="cases" class="active">Cases</button>
    <button data-view="runs">Runs</button>
  </nav>
  <span id="run-badge" class="badge muted">No run selected</span>
  <span id="toast" class="toast" hidden></span>
</header>
<main id="root" class="layout"></main>
<footer class="legend">
  <span><kbd>j</kbd> <kbd>k</kbd> move</span>
  <span><kbd>p</kbd> <kbd>f</kbd> <kbd>b</kbd> <kbd>s</kbd> <kbd>r</kbd> verdict</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>Enter</kbd> actual result</span>
  <span><kbd>/</kbd> search</span>
  <span><kbd>Esc</kbd> leave field</span>
  <span><kbd>?</kbd> keys</span>
</footer>
<div id="overlay-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
